name: VietDrive

options:
  bundleIdPrefix: vn.vietdrive
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  # Xcode 26+ treats a modern watchOS app as a Foundation extension and
  # requires it in PlugIns rather than the legacy Watch directory.
  postGenCommand: /usr/bin/sed -i '' -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|' -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|' VietDrive.xcodeproj/project.pbxproj

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    exactVersion: 6.29.0

settings:
  base:
    SWIFT_VERSION: 5.0
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: Y22YY8X6F4
    CODE_SIGN_STYLE: Automatic

targets:
  VietDrive:
    type: application
    platform: iOS
    sources:
      - path: VietDrive
        excludes:
          - Services/BluetoothBridgeService.swift
          - Views/DeviceProjectionView.swift
          # The bundled copy is identical; keep the explicit extracted source
          # below as the single authoritative build resource.
          - Resources/map_database_v2.sqlite
      - path: Shared
      - path: ../extracted/map_database_v2.sqlite
        buildPhase: resources
      - path: ../extracted/data_manifest.json
        buildPhase: resources
    dependencies:
      - package: MapLibre
      - sdk: libsqlite3.tbd
      - target: VietDriveWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.vietdrive.ios
        PRODUCT_NAME: VietDrive
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: VietDrive/Support/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.3.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
  VietDriveWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: VietDriveWatch
      - path: Shared
      - path: VietDrive/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.vietdrive.ios.watchkitapp
        PRODUCT_NAME: VietDrive Watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VietDrive
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: vn.vietdrive.ios
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.3.0
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 4
  VietDriveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VietDriveTests
    dependencies:
      - target: VietDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.vietdrive.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VietDrive:
    build:
      targets:
        VietDrive: all
    run:
      config: Debug
    test:
      targets:
        - VietDriveTests
  VietDriveWatch:
    build:
      targets:
        VietDriveWatch: all
    run:
      config: Debug
